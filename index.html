<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Scanner Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #05070f;
            --card-bg: rgba(16, 23, 42, 0.75);
            --border-color: #1e293b;
            --accent-cyan: #06b6d4;
            --accent-neon: #3b82f6;
            --accent-glow: rgba(6, 182, 212, 0.4);
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(6, 182, 212, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Status Badge */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            transition: all 0.3s;
        }

        .status-dot.online {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        /* Camera Box com HUD Frame */
        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 280px;
            margin: 0 auto;
            border-radius: 18px;
            background: #020617;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Efeito de Scanner Laser */
        .scanner-line {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            box-shadow: 0 0 15px var(--accent-cyan);
            animation: scan 2s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .camera-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
        }

        /* Botão estilizado */
        .btn-start {
            font-family: 'Orbitron', sans-serif;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-neon));
            border: none;
            border-radius: 12px;
            color: #05070f;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--accent-glow);
            filter: brightness(1.1);
        }

        .btn-start:disabled {
            background: #1e293b;
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Previsões / Barras */
        .predictions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .prediction-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }

        .prediction-card.active {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.08);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-value {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-cyan);
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #020617;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-neon));
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.15s ease-out;
        }

        /* Log de Detecção */
        .log-box {
            background: #020617;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
            display: flex;
            justify-content: space-between;
        }

        .log-box span {
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <div class="header-title">
                <h1>AI VISION PRO</h1>
                <p>TEACHABLE MACHINE ENGINE</p>
            </div>
            <div class="status-badge">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">OFFLINE</span>
            </div>
        </div>

        <div class="camera-container" id="camera-container">
            <div class="scanner-line" id="scanner-line"></div>
            <div class="placeholder-text" id="placeholder">
                [ CÂMERA DESATIVADA ]
            </div>
        </div>

        <button class="btn-start" id="start-btn" onclick="init()">INICIAR RECONHECIMENTO</button>

        <div class="predictions-list" id="label-container"></div>

        <div class="log-box">
            <span>STATUS:</span>
            <span id="log-status">Aguardando comando...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // Se usar o modelo hospedado na nuvem, troque a linha abaixo pelo seu link:
        // const URL = "https://teachablemachine.withgoogle.com/models/SEU_ID/";
        const URL = "./modelos/";

        let model, webcam, labelContainer, maxPredictions;
        let isRunning = false;

        async function init() {
            if (isRunning) return;

            const startBtn = document.getElementById("start-btn");
            const logStatus = document.getElementById("log-status");
            
            startBtn.disabled = true;
            startBtn.innerText = "CARREGANDO REDE NEURAL...";
            logStatus.innerText = "Baixando modelo...";

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                // Carrega o Modelo
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                logStatus.innerText = "Iniciando webcam...";

                // Configura a Webcam
                const flip = true; 
                webcam = new tmImage.Webcam(280, 280, flip); 
                await webcam.setup(); 
                await webcam.play();
                window.requestAnimationFrame(loop);

                // Efeitos visuais de Ativo
                document.getElementById("placeholder").style.display = "none";
                document.getElementById("scanner-line").style.display = "block";
                document.getElementById("status-dot").classList.add("online");
                document.getElementById("status-text").innerText = "ONLINE";
                
                const cameraContainer = document.getElementById("camera-container");
                cameraContainer.appendChild(webcam.canvas);

                // Monta os Cards com Barras
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                
                for (let i = 0; i < maxPredictions; i++) {
                    const card = document.createElement("div");
                    card.className = "prediction-card";
                    card.id = `card-${i}`;

                    card.innerHTML = `
                        <div class="card-header">
                            <span id="title-${i}">---</span>
                            <span class="card-value" id="val-${i}">0%</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" id="fill-${i}"></div>
                        </div>
                    `;
                    labelContainer.appendChild(card);
                }
                
                isRunning = true;
                startBtn.innerText = "SCANNER EM EXECUÇÃO";
                logStatus.innerText = "Processando frames em tempo real.";

            } catch (error) {
                console.error("Erro ao inicializar:", error);
                startBtn.disabled = false;
                startBtn.innerText = "RECOBRAR TENTATIVA";
                logStatus.innerText = "Erro ao acessar modelo/câmera.";
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let topProb = -1;
            let topIndex = -1;

            for (let i = 0; i < maxPredictions; i++) {
                const prob = prediction[i].probability;
                const percent = Math.round(prob * 100);

                if (prob > topProb) {
                    topProb = prob;
                    topIndex = i;
                }

                // Atualiza Textos e Barra Animada
                document.getElementById(`title-${i}`).innerText = prediction[i].className;
                document.getElementById(`val-${i}`).innerText = percent + "%";
                document.getElementById(`fill-${i}`).style.width = percent + "%";
                
                // Reseta estado ativo
                document.getElementById(`card-${i}`).classList.remove("active");
            }

            // Destaca a maior probabilidade (se for acima de 20%)
            if (topIndex !== -1 && topProb > 0.2) {
                document.getElementById(`card-${topIndex}`).classList.add("active");
            }
        }
    </script>
</body>
</html>
